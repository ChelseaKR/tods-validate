# Repository waiver registry (portfolio waiver-hygiene convention, SEC-10).
#
# Every entry is dated, owned, and expiring. An entry accepts exactly one
# finding: `kind: npm-audit` waivers are matched by scripts/check_npm_audit.py
# against the advisory id, the package, the severity, and the npm project the
# advisory was reported in, all four. A new advisory, the same advisory on a
# different package, the same advisory escalated to a higher severity, or the
# same advisory in a different npm project is not covered by any entry here
# and fails the gate.
#
# The npm project is the optional `tree:` field, a repository-relative path
# defaulting to `.` (the root). It exists because the gate audits every
# `package-lock.json` in the repository, and the prose in a waiver is an
# argument about one dependency tree: WVR-003 below reasons about the VS Code
# extension's packaging tool, which says nothing about the same advisory
# arriving in the accessibility toolchain at the root. A `tree:`
# naming a directory that holds no lockfile is a gate failure, so a waiver
# cannot outlive the project it describes. `kind: playground-version-pin`
# waivers are matched by
# tests/test_playground.py against the playground's pinned version and
# pyproject.toml's project version, both. An expired or malformed entry
# accepts nothing.
version: 1

waivers:
  - id: WVR-003
    control: SEC-11
    repo: tods-validate
    kind: npm-audit
    tree: editor/vscode
    advisory: GHSA-fc5q-39xc-vjpf
    package: picomatch
    version: 4.0.7
    severity: high
    dependency_path: >-
      @vscode/vsce@4.0.0 -> tinyglobby@0.2.17 -> picomatch@4.0.7, and
      @vscode/vsce@4.0.0 -> tinyglobby@0.2.17 -> fdir@6.5.0 -> picomatch@4.0.7
    reason: >-
      picomatch through 4.0.7 backtracks exponentially on a single-branch
      repeated extglob such as +(*) or +(*a), so whoever supplies the glob
      pattern can block the Node.js event loop (CWE-1333, CVSS 7.5). It
      reaches this repository only in the VS Code extension's development
      tree, under @vscode/vsce, the packaging tool that `npm run package`
      runs to build the VSIX. @vscode/vsce is a devDependency. It hands
      tinyglobby the fixed pattern `**` and the ignore patterns in this
      repository's own .vscodeignore, so no pattern comes from a user or a
      feed. Nothing in the built extension loads it: the extension's one
      runtime dependency, vscode-languageclient, does not depend on
      picomatch, and the extension is not published to the Marketplace or
      Open VSX. No patched release of picomatch exists as of 2026-11-17: the
      latest is 4.0.7 and the advisory lists no fixed version. The newest
      @vscode/vsce, 4.1.1, still depends on tinyglobby, whose newest release
      still depends on picomatch 4. The only remedy npm offers is moving
      @vscode/vsce back to 3.9.1, the major line that #268 left to clear the
      braces advisory GHSA-vfj7-8cjw-p6xm. Accepted on that basis for 30
      days, to be re-reviewed on or before the expiry date below and
      released the moment picomatch ships a fixed version or @vscode/vsce
      moves off it.
    owner: chelseakr
    granted: 2026-11-17
    expires: 2026-12-17
    link: https://github.com/advisories/GHSA-fc5q-39xc-vjpf
