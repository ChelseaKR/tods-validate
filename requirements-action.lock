# Hash-pinned lock of tods-validate's runtime dependency tree, used by
# action.yml to install the CLI without any floating/unpinned network
# fetches. Regenerate when pyproject.toml's `dependencies` change:
#
#   pip download <dep> -d /tmp/w && pip hash /tmp/w/*.whl
#
# click has no transitive runtime dependencies on Linux (colorama is
# pulled in only via a `sys_platform == "win32"` marker), which is the
# only platform actions/setup-python runs this composite action on here.
