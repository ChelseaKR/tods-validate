name: CodeQL

# SAST (SEC-07/08, CICD-20). Two languages: python (the validator itself) and
# actions (the 6 workflows + action.yml, for the injection/permission classes
# CodeQL's actions query pack understands).

# CICD §11e trigger shape: PRs into main + weekly schedule. No push trigger —
# the pull_request run already analyzed the same changes before merge.
on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC

# Cancel superseded runs of the same ref (CICD §11c). The trailing
# discriminator keeps that from eating a verdict on main: `pr` coalesces a
# PR's runs as before, while a push groups per commit SHA so one commit's run
# can never cancel another's. See ci.yml for the full reasoning.
concurrency:
  group: codeql-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # required to upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "actions"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
