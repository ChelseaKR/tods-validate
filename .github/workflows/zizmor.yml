name: Workflow SAST (zizmor)

# Static analysis of the workflows themselves (CICD-19/CICD-21): template
# injection, excessive permissions, missing pinning, dangerous triggers.
# Blocking on the "regular" persona (minimal false positives), which is what
# this repo's workflows are clean under as of the 2026-07-05 conformance
# remediation; run `zizmor --persona=pedantic .github/workflows/ action.yml`
# locally for additional code-smell-level findings that do not block here.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "action.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "action.yml"

# Cancel superseded runs of the same ref (CICD §11c).
concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install zizmor
      - run: zizmor --min-severity high .github/workflows/ action.yml
