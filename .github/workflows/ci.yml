name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: make lint
      - run: make format
      - run: make typecheck

  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Check that docs/rules.md matches the rule registry
        run: make docs-check

  i18n:
    # Enforce the i18n N/A declaration (INTERNATIONALIZATION-STANDARD §1): fail
    # if docs/I18N.md is missing its status marker or its Reason line.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Check the i18n N/A declaration is present
        run: python scripts/check_i18n.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: make test

  # Dependency vulnerability audit (CQ-11 / SEC-11). Blocking; no mute pattern.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: make audit

  # Secret scan over the PR/push diff and full history (SEC-17/18). Installs
  # the gitleaks CLI directly (checksum-verified) rather than the third-party
  # `gitleaks/gitleaks-action`, which is license-gated for organizations.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: gitleaks scans commits, not just the tree
      - name: Install gitleaks (checksum-verified)
        run: |
          set -eu
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - run: make secrets

  action-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Run the action against the valid fixture feed
        uses: ./
        with:
          path: tests/fixtures/valid/tods
          gtfs: tests/fixtures/valid/gtfs

  merge-handoff:
    # Materialize the TODS-Supplemented GTFS and hand it to gtfs-validator, so
    # the merge contract is exercised end to end. Informational: a downstream
    # change should surface here without blocking unrelated work.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install .
      - name: Merge the valid fixture feed
        run: |
          tods-validate merge tests/fixtures/valid/tods \
            --gtfs tests/fixtures/valid/gtfs -o supplemented.zip
      - name: Validate the merged feed with gtfs-validator
        run: |
          # Pin a versioned asset and verify its checksum. gtfs-validator v8.0.1
          # dropped the unversioned latest/download/gtfs-validator-cli.jar, so the
          # old URL 404s. A bare `curl -sSL` follows the redirect but does not fail
          # on 404, and silently saved the error page as the jar ("Invalid or
          # corrupt jarfile"). The -f flag fails on HTTP errors; sha256sum -c
          # catches a swapped or truncated artifact before java runs it.
          curl -fsSL -o gtfs-validator.jar \
            https://github.com/MobilityData/gtfs-validator/releases/download/v8.0.1/gtfs-validator-8.0.1-cli.jar
          echo "19293ddd9b6f954f216d4f12054bd8a3232921751c4484339e339764a91000e2  gtfs-validator.jar" | sha256sum -c -
          java -jar gtfs-validator.jar -i supplemented.zip -o validator-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gtfs-validator-report
          path: validator-report
