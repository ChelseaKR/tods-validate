name: Publish to PyPI

# Publishes the sdist + wheel to PyPI using OIDC Trusted Publishing.
# No API token is stored anywhere; PyPI verifies this workflow's identity.
# One-time setup on PyPI: add a GitHub trusted publisher for project
# "tods-validate" pointing at owner ChelseaKR, repo tods-validate,
# workflow "pypi-publish.yml" (environment left blank).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for PyPI Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
