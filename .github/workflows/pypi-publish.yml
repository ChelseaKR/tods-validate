name: Publish to PyPI

# Publishes the sdist + wheel to PyPI using OIDC Trusted Publishing.
# No API token is stored anywhere; PyPI verifies this workflow's identity.
# One-time setup on PyPI: add a GitHub trusted publisher for project
# "tods-validate" pointing at owner ChelseaKR, repo tods-validate,
# workflow "pypi-publish.yml" (environment left blank).
#
# Supply-chain hardening (SECURITY-AND-SUPPLY-CHAIN-STANDARD Section 6):
#   - CycloneDX 1.7 SBOM for the built wheel/sdist, blocking (Section 6.2).
#   - SLSA build provenance attestation for dist/* (Section 6.4).
# Caching is intentionally absent from this signing/publishing job (Section 6.4).
#
# Release-integrity hardening (REL-14/15/16, added after the 2026-07-05
# conformance audit): `publish` no longer runs standalone. `verify` re-runs
# the full gate set (make verify) at the tagged commit, plus version and
# tag-signature checks, and `publish` will not run unless it is green.
# `verify-published` then re-downloads what was actually published and
# checks its provenance attestation, so a "succeeded" run means the artifact
# on PyPI is the one that was verified, not merely that upload didn't error.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing signed stable SemVer tag (vX.Y.Z)"
        required: true
        type: string

# Least-privilege default; the publish job escalates only what it needs.
permissions:
  contents: read

# Never run two publishes of the same ref at once (Section 6.4).
concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  authorize:
    name: verify trusted main and signed release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_commit: ${{ steps.tag.outputs.commit }}
      release_tag: ${{ steps.tag.outputs.tag }}
      tag_object_sha: ${{ steps.tag.outputs.tag_object_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and verify the reviewed signed tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG}"
          test "${GITHUB_REF}" = refs/heads/main
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          [[ "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git cat-file -t "refs/tags/${TAG}")" = tag
          RELEASE_COMMIT="$(git rev-parse --verify "${TAG}^{commit}")"
          git merge-base --is-ancestor "${RELEASE_COMMIT}" origin/main
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "${GITHUB_WORKSPACE}/.github/allowed_signers"
          git verify-tag -- "${TAG}"
          {
            echo "tag=${TAG}"
            echo "commit=${RELEASE_COMMIT}"
            echo "tag_object_sha=$(git rev-parse "refs/tags/${TAG}")"
          } >> "${GITHUB_OUTPUT}"

  verify:
    needs: authorize
    uses: ./.github/workflows/verify.yml
    with:
      tag: ${{ needs.authorize.outputs.release_tag }}
      commit: ${{ needs.authorize.outputs.release_commit }}

  build:
    needs: [authorize, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write # SLSA build provenance attestation
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.authorize.outputs.release_commit }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build
      - run: python -m build

      # CycloneDX 1.7 SBOM of the built wheel and its dependency closure.
      # Blocking: --validate fails the job on any schema violation (Section 6.2).
      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install --upgrade cyclonedx-bom
          python -m venv sbom-env
          ./sbom-env/bin/python -m pip install --upgrade pip
          ./sbom-env/bin/python -m pip install dist/*.whl
          cyclonedx-py environment ./sbom-env/bin/python \
            --sv 1.7 \
            --of JSON \
            --output-reproducible \
            --pyproject pyproject.toml \
            --mc-type library \
            --validate \
            -o tods-validate-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: tods-validate-sbom.cdx.json
          if-no-files-found: error
      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error

      # SLSA build provenance for the wheel + sdist (Section 6.4, SLSA Build L2).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"

  publish-release:
    needs: [authorize, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom-cyclonedx
      - name: Recheck immutable tag object and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.authorize.outputs.release_tag }}
          TAG_OBJECT_SHA: ${{ needs.authorize.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          LIVE_TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha)"
          test "${LIVE_TAG_OBJECT}" = "${TAG_OBJECT_SHA}"
          gh release create "${TAG}" tods-validate-sbom.cdx.json \
            --title "tods-validate ${TAG}" --generate-notes --verify-tag

  publish-pypi:
    needs: [authorize, build, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pypi-distributions
          path: dist
      - name: Recheck immutable tag object before PyPI publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.authorize.outputs.release_tag }}
          TAG_OBJECT_SHA: ${{ needs.authorize.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          LIVE_TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha)"
          test "${LIVE_TAG_OBJECT}" = "${TAG_OBJECT_SHA}"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1

  verify-published:
    # Re-fetch what actually landed on PyPI and check its attestation, rather
    # than trusting that `publish` exiting 0 means the right bits are public
    # (REL-16). Only meaningful for a real release, not workflow_dispatch.
    needs: [authorize, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.authorize.outputs.release_tag }}
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
      - name: Wait for the index to pick up the new release
        run: sleep 30
      - name: Download the published distribution from PyPI
        run: |
          set -eu
          VERSION="${TAG#v}"
          python -m pip download "tods-validate==$VERSION" --no-deps -d dist-published
      - name: Verify SLSA build provenance attestation
        run: |
          set -eu
          for f in dist-published/*; do
            gh attestation verify "$f" --owner ChelseaKR
          done
