name: Publish to PyPI

# Publishes the sdist + wheel to PyPI using OIDC Trusted Publishing.
# No API token is stored anywhere; PyPI verifies this workflow's identity.
# One-time setup on PyPI: add a GitHub trusted publisher for project
# "tods-validate" pointing at owner ChelseaKR, repo tods-validate,
# workflow "pypi-publish.yml", environment "pypi" (CICD-06).
#
# The environment is the second half of the scoping. Without it, any workflow
# in this repository that can mint an OIDC token can publish; with it, PyPI
# accepts only a token minted by the `pypi` environment, which the repository
# can restrict independently. Order matters when changing this: PyPI treats a
# blank environment as "any", so adding the line below is safe on its own, and
# setting the environment on PyPI is what starts enforcing it. Do it in that
# order, or a release will fail to publish.
#
# Supply-chain hardening (SECURITY-AND-SUPPLY-CHAIN-STANDARD Section 6):
#   - CycloneDX 1.7 SBOM for the built wheel/sdist, blocking (Section 6.2).
#   - SLSA build provenance attestation for dist/* (Section 6.4).
# Caching is intentionally absent from this signing/publishing job (Section 6.4).
#
# Release-integrity hardening (REL-14/15/16, added after the 2026-07-05
# conformance audit): `publish` no longer runs standalone. `verify` re-runs
# the full gate set (make verify) at the tagged commit, plus version and
# tag-signature checks, and `publish` will not run unless it is green.
# `verify-published` then re-downloads what was actually published and
# checks its provenance attestation, so a "succeeded" run means the artifact
# on PyPI is the one that was verified, not merely that upload didn't error.
#
# `deploy-playground` runs last: the GitHub Pages playground pins the wheel
# this workflow publishes, so its deploy is sequenced after the wheel is
# confirmed on PyPI rather than triggered by the release event it used to
# race (and lose, on v0.8.0 and v0.9.0 -- see pages.yml).
#
# BOTH TRIGGERS PUBLISH, SO BOTH TRIGGERS MUST NAME A TAG.
# `workflow_dispatch` used to take no inputs, and `verify` was called with an
# empty `tag` on that path. docs/CONFORMANCE-GAPS.md described that as gating
# the release checks so "they only run for a real release event, never for
# `workflow_dispatch` smoke-runs" -- but `publish` carries no trigger
# condition, so a dispatch was never a smoke-run: it uploaded to PyPI. Run
# 31966563243 (2026-08-16) is the proof, and it is not a hypothetical: its
# `verify / verify` job reports steps 12 and 13 -- "Version consistency
# (REL-03)" and "Tag is annotated and signed (REL-08)" -- as `skipped`, its
# `publish` job as `success`, its `verify-published` job as `skipped`, and the
# run itself as `success`. A PyPI upload cannot be undone.
#
# The tag input is `required` for that reason. It flows to `verify`, so the
# dispatch path enforces the same version-consistency and signed-tag checks
# the release path does, and to `verify-published`, so what actually landed on
# PyPI is re-checked on both paths rather than on one of them.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Signed release tag to publish (vX.Y.Z). A dispatch publishes to PyPI; PyPI uploads cannot be withdrawn."
        required: true
        type: string

# Least-privilege default; the publish job escalates only what it needs.
permissions:
  contents: read

# Never run two publishes of the same ref at once (Section 6.4).
concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      # `with:` on a reusable-workflow call may only read `github`, `inputs`,
      # `vars` and `needs`, so the tag is resolved inline here rather than in a
      # workflow-level `env:`. Both arms are non-empty by construction: a
      # release event always carries `tag_name`, and `inputs.tag` is `required`
      # on the dispatch path. An empty value would silently disable the two
      # release checks in verify.yml, which is the defect this replaced.
      tag: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

  publish:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Scopes the OIDC token PyPI accepts (CICD-06). See the header for why the
    # PyPI side has to be changed after this, not before.
    #
    # The environment's deployment branch policy admits the tag pattern `v*`
    # and nothing else, so `workflow_dispatch` from a branch is refused here
    # rather than partway through a publish. Dispatch from a version tag.
    environment:
      name: pypi
      url: https://pypi.org/project/tods-validate/
    permissions:
      contents: write # attach the SBOM to the GitHub release
      id-token: write # OIDC for PyPI Trusted Publishing + provenance
      attestations: write # SLSA build provenance attestation
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build
      - run: python -m build

      # CycloneDX 1.7 SBOM of the built wheel and its dependency closure.
      # Blocking: --validate fails the job on any schema violation (Section 6.2).
      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install --upgrade cyclonedx-bom
          python -m venv sbom-env
          ./sbom-env/bin/python -m pip install --upgrade pip
          ./sbom-env/bin/python -m pip install dist/*.whl
          cyclonedx-py environment ./sbom-env/bin/python \
            --sv 1.7 \
            --of JSON \
            --output-reproducible \
            --pyproject pyproject.toml \
            --mc-type library \
            --validate \
            -o tods-validate-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: tods-validate-sbom.cdx.json
          if-no-files-found: error

      # SLSA build provenance for the wheel + sdist (Section 6.4, SLSA Build L2).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      # Attach the SBOM to the GitHub release for consumer verification.
      - name: Upload SBOM to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          # Routed through env: rather than interpolated into the run: shell
          # (CICD-21): see the note in release-corpus.yml.
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" tods-validate-sbom.cdx.json --clobber

  verify-published:
    # Re-fetch what actually landed on PyPI and check its attestation, rather
    # than trusting that `publish` exiting 0 means the right bits are public
    # (REL-16).
    #
    # This used to carry `if: github.event_name == 'release'`, on the premise
    # that a dispatch was a smoke-run. `publish` has no such condition, so the
    # dispatch path uploaded to PyPI and then skipped the only step that reads
    # back what was uploaded -- and a run whose remaining job is skipped
    # concludes `success`. It now runs on every path that can publish, which is
    # every path this workflow has.
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Wait for the index to pick up the new release
        run: sleep 30
      - name: Download the published distribution from PyPI
        run: |
          set -eu
          VERSION="${TAG#v}"
          python -m pip download "tods-validate==$VERSION" --no-deps -d dist-published
      - name: Verify SLSA build provenance attestation
        run: |
          set -eu
          for f in dist-published/*; do
            gh attestation verify "$f" --owner ChelseaKR
          done

  deploy-playground:
    # The playground micropip-installs the exact wheel published above, so it
    # deploys only after `verify-published` has confirmed that wheel is really
    # on PyPI. Deploying on the release event raced this upload and lost on
    # v0.8.0 and v0.9.0: pages.yml's guard fired seconds after the release was
    # published, long before the wheel existed, and the live page stayed on
    # the previous release. `needs` makes that ordering structural. The guard
    # in pages.yml still runs, so if PyPI somehow stops serving the wheel the
    # deploy fails naming it rather than publishing a page that cannot
    # install itself.
    needs: [verify-published]
    if: github.event_name == 'release'
    permissions:
      contents: read
      pages: write # publish the built site to GitHub Pages
      id-token: write # OIDC to prove the deploying workflow produced the artifact
    uses: ./.github/workflows/pages.yml
